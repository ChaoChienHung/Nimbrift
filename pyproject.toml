[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbrift"
version = "0.1.0"
description = "SSH file transfers with a CLI and desktop GUI"
requires-python = ">=3.10"
dependencies = ["paramiko>=3.4,<5"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<7"]
build = ["PySide6-Essentials>=6.8,<7", "pyinstaller>=6.20,<7"]

[project.scripts]
nimbrift = "nimbrift.cli:main"
nimbrift-gui = "nimbrift.gui:main"

[tool.setuptools.packages.find]
include = ["nimbrift*"]
