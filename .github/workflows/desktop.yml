name: Test and build desktop app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install application and GUI dependencies
        run: python -m pip install -e '.[gui]'
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  macos-app:
    name: Build macOS app
    needs: tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -e '.[build]'
      - name: Package Nimbrift.app
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build_app.py --skip-tests
      - name: Validate app bundle
        run: |
          test -x dist/Nimbrift.app/Contents/MacOS/Nimbrift
          plutil -lint dist/Nimbrift.app/Contents/Info.plist
      - name: Smoke test bundled app
        run: python scripts/smoke_app.py
      - name: Create downloadable zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/Nimbrift.app dist/Nimbrift-macOS-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Nimbrift-macOS-arm64
          path: dist/Nimbrift-macOS-arm64.zip
          if-no-files-found: error
